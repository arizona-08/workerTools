name: CD - Production

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/workertools-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/workertools-backend

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    steps:

      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image tag
        id: image-tag
        shell: bash
        run: |
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"

          IMAGE_TAG="sha-${SHORT_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "Images will be tagged with: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.staging
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # Backend
      # ---------------------------------------------------------

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.staging
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # SSH
      # ---------------------------------------------------------

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${SSH_PORT:-22}" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # Préparation VPS
      # ---------------------------------------------------------

      - name: Prepare deployment directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p /opt/workertools/nginx"

      # ---------------------------------------------------------
      # SCP des fichiers nécessaires au déploiement
      # ---------------------------------------------------------

      - name: Upload Docker Compose file
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/id_ed25519 \
            -P "${SSH_PORT:-22}" \
            docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:/opt/workertools/docker-compose.prod.yml"

      - name: Upload Nginx configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/id_ed25519 \
            -P "${SSH_PORT:-22}" \
            nginx/nginx.conf \
            "$SSH_USER@$SSH_HOST:/opt/workertools/nginx/nginx.conf"

      # ---------------------------------------------------------
      # Déploiement Docker
      # ---------------------------------------------------------

      - name: Deploy application
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_USER }}

          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
              set -euo pipefail

              cd /opt/workertools

              echo "Logging into GHCR..."

              echo "$GHCR_TOKEN" | docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

              export IMAGE_TAG="$IMAGE_TAG"

              echo "Pulling Docker images..."

              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                pull

              echo "Starting containers..."

              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                up -d \
                --remove-orphans

              echo "Waiting for containers..."
              sleep 10

              echo "Running Laravel migrations..."

              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                exec -T backend \
                php artisan migrate --force

              echo "Clearing Laravel caches..."

              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                exec -T backend \
                php artisan optimize:clear

              echo "Optimizing Laravel..."

              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                exec -T backend \
                php artisan optimize

              echo "Container status:"

              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                ps

              echo "Cleaning dangling images..."

              docker image prune -f

              echo "Deployment completed."
          REMOTE