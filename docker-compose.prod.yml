name: workertools

services:
  traefik:
    image: traefik:v2.11
    container_name: workertools-traefik
    restart: unless-stopped

    command:
      - --api.dashboard=false

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=workertools-proxy

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true

      - --log.level=INFO
      - --accesslog=true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

    networks:
      - proxy

  frontend:
    image: ghcr.io/arizona-08/workertools-frontend:${IMAGE_TAG:-staging}
    container_name: workertools-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000

    expose:
      - "4000"

    networks:
      - proxy

    labels:
      - traefik.enable=true

      - traefik.http.routers.workertools-frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.workertools-frontend.entrypoints=websecure
      - traefik.http.routers.workertools-frontend.tls=true
      - traefik.http.routers.workertools-frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.workertools-frontend.priority=10

      - traefik.http.services.workertools-frontend.loadbalancer.server.port=4000

  backend:
    image: ghcr.io/arizona-08/workertools-backend:${IMAGE_TAG:-staging}
    container_name: workertools-backend
    restart: unless-stopped

    environment:
      APP_NAME: WorkerTools
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://${APP_DOMAIN}

      ALLOWED_FRONTEND_ORIGIN: https://${APP_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax

      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

    expose:
      - "9000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: workertools-backend-nginx
    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - app
      - proxy

    labels:
      - traefik.enable=true

      - traefik.http.routers.workertools-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/sanctum`))
      - traefik.http.routers.workertools-api.entrypoints=websecure
      - traefik.http.routers.workertools-api.tls=true
      - traefik.http.routers.workertools-api.tls.certresolver=letsencrypt
      - traefik.http.routers.workertools-api.priority=100

      - traefik.http.services.workertools-api.loadbalancer.server.port=80

  db:
    image: postgres:18-alpine
    container_name: workertools-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - app

networks:
  proxy:
    name: workertools-proxy

  app:
    name: workertools-app
    internal: true

volumes:
  postgres_data:
    name: workertools-postgres-data

  traefik_letsencrypt:
    name: workertools-traefik-letsencrypt