services:
  # frontend:
  #   container_name: frontend
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "4200:4200"
  #   env_file:
  #     - ./frontend/.env
  #   networks:
  #     - workertools-network

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html:ro
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - workertools-network

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    expose:
      - "9000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    command: sh -c "chmod +x /var/www/html/docker/entrypoint.dev.sh && /var/www/html/docker/entrypoint.dev.sh"
    depends_on:
      - db
    networks:
      - workertools-network

  db:
    container_name: db
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/
    networks:
      - workertools-network


networks:
  workertools-network:
    driver: bridge

volumes:
  db_data:
