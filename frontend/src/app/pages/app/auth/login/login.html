<section class="w-full max-w-md rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="login-title">
  <p class="text-sm font-semibold text-violet-700">WorkerTools</p>
  <h1 id="login-title" class="mt-2 text-2xl font-semibold tracking-tight text-zinc-950">Connexion</h1>
  <p class="mt-2 text-sm leading-6 text-zinc-600">Connectez-vous pour accéder à vos calculs de structure.</p>

  <form class="mt-7 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="email" class="block text-sm font-medium text-zinc-800">Adresse email</label>
      <input id="email" type="email" autocomplete="email" formControlName="email" [attr.aria-invalid]="fieldError('email') !== null" aria-describedby="email-error" class="mt-1.5 block w-full rounded-lg border border-zinc-300 px-3 py-2.5 text-zinc-950 outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-100" />
      @if (fieldError('email'); as fieldErrorMessage) { <p id="email-error" class="mt-1.5 text-sm text-red-700" role="alert">{{ fieldErrorMessage }}</p> }
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-zinc-800">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" formControlName="password" [attr.aria-invalid]="fieldError('password') !== null" aria-describedby="password-error" class="mt-1.5 block w-full rounded-lg border border-zinc-300 px-3 py-2.5 text-zinc-950 outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-100" />
      @if (fieldError('password'); as fieldErrorMessage) { <p id="password-error" class="mt-1.5 text-sm text-red-700" role="alert">{{ fieldErrorMessage }}</p> }
    </div>

    @if (error(); as errorMessage) { <p class="rounded-lg bg-red-50 p-3 text-sm text-red-800" role="alert">{{ errorMessage }}</p> }

    <button type="submit" [disabled]="isSubmitting()" class="w-full rounded-lg bg-violet-700 px-4 py-2.5 text-sm font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-700 disabled:cursor-not-allowed disabled:opacity-55">
      @if (isSubmitting()) { Connexion en cours… } @else { Se connecter }
    </button>
  </form>
</section>
