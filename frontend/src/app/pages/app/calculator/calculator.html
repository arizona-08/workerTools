<main class="w-full max-w-5xl mx-auto mt-24">
  <h1 class="text-2xl font-semibold mb-4">Calculateur</h1>
  <p class="text-gray-600 mb-6">Utilisez le calculateur pour estimer les coûts et les bénéfices de vos projets.</p>


  <div class="flex flex-col items-end gap-12">
    <!-- module selector -->
    <!-- accueil les différents formulaires -->

     <app-module-selector (onSelectModuleForm)="handleModuleChange($event)"/>
     <div class="w-full bg-white rounded-lg p-6">
      
      @switch (selectedModule()) {
        @case ('Poutre') {
          <p>Poutre</p>
        }
        @case ('Dalle') {
          <p>Dalle</p>
        }
      }

     </div>
  </div>
</main>
