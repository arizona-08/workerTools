<header class="px-4 py-6 relative flex items-center justify-center bg-white rounded-lg">
  <div class="absolute left-0 ml-4">
    <a routerLink="/app" class="text-2xl font-semibold">WorkerTools<span class="text-orange-500">.</span></a>
  </div>

  <nav>
    <ul class="flex items-center justify-between gap-5">
      @for (link of links(); track $index) {
        <li class="px-3 py-2 font-medium text-zinc-600 hover:bg-gray-100 rounded-lg transition-all duration-150"><a [routerLink]="link.path">{{ link.label }}</a></li>
      }
    </ul>
  </nav>
</header>
