<header class="flex flex-col gap-4 rounded-lg bg-white px-4 py-6 sm:relative sm:flex-row sm:items-center sm:justify-center">
  <div class="sm:absolute sm:left-0 sm:ml-4">
    <a routerLink="/app" class="text-2xl font-semibold">WorkerTools<span class="text-orange-500">.</span></a>
  </div>

  <nav class="w-full overflow-x-auto sm:w-auto">
    <ul class="flex w-max min-w-full items-center justify-between gap-5 sm:min-w-0">
      @for (link of links(); track $index) {
        <li class="px-3 py-2 font-medium text-zinc-600 hover:bg-gray-100 rounded-lg transition-all duration-150"><a [routerLink]="link.path">{{ link.label }}</a></li>
      }
    </ul>
  </nav>
</header>
