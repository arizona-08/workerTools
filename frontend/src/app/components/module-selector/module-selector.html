<div class="inline-flex rounded-xl border border-violet-100 bg-violet-50 p-1" role="group" aria-label="Module de calcul">
  @for (module of modules(); track module.id) {
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm font-semibold transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-700"
      [class.bg-white]="selectedModule() === module.id"
      [class.text-violet-800]="selectedModule() === module.id"
      [class.shadow-sm]="selectedModule() === module.id"
      [class.text-zinc-600]="selectedModule() !== module.id"
      [attr.aria-pressed]="selectedModule() === module.id"
      (click)="select(module.id)"
    >
      {{ module.label }}
    </button>
  }
</div>
